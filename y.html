<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerçekçi 3D Yılbaşı Ağacı</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #020205; 
            font-family: sans-serif; 
        }
        #container { width: 100%; height: 100vh; }
        .overlay-text {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="overlay-text">
        MUTLU YILLARR🎄🎅
    </div>
    <div id="container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // AYARLAR 
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.002); // Derinlik için sis

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 80); // Kamerayı biraz yukarı ve uzağa koy

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true; // Gölgeleri aç
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('container').appendChild(renderer.domElement);

        // Kontroller (Mouse ile döndürme)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // Yerin altına bakmayı engelle

        // IŞIKLANDIRMA (Görseldeki dramatik ışık için)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.1); // Az ortam ışığı
        scene.add(ambientLight);

        // Ana spot ışığı (yukarıdan ve önden)
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
        mainLight.position.set(20, 50, 30);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        // Süsleri parlatmak için yardımcı ışıklar
        const backLight = new THREE.PointLight(0x5555ff, 0.5);
        backLight.position.set(0, 20, -40);
        scene.add(backLight);

        // ZEMİN 
        // Görselde zemin görünmüyor ama gölge düşmesi için görünmez bir zemin lazım
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);

        // AĞAÇ OLUŞTURMA (InstancedMesh Tekniği) 
        const treeGroup = new THREE.Group();
        scene.add(treeGroup);

        function createDenseTree() {
            const treeHeight = 45;
            const maxRadius = 18;
            
            // 1. AĞAÇ GÖVDESİ (İçeride kalacak, görünmeyecek ama temel olacak)
            const trunkGeo = new THREE.CylinderGeometry(2, 4, treeHeight/2, 16);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2817 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = treeHeight / 4;
            treeGroup.add(trunk);

            // 2. YAPRAKLAR (Görseldeki pofuduk doku için binlerce küçük parça)
            const leafCount = 8000; // Ne kadar yüksek, o kadar yoğun (ve yavaş)
            const leafGeo = new THREE.ConeGeometry(0.8, 1.5, 6); // Küçük koniler
            leafGeo.rotateX(Math.PI * 0.5); // Yatay çevir
            
            const leafMat = new THREE.MeshStandardMaterial({ 
                color: 0x0a5c0a, // Koyu çam yeşili
                roughness: 0.8,
                metalness: 0.1
            });
            
            // InstancedMesh: Performans için tek seferde binlerce çizim
            const leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, leafCount);
            leafMesh.castShadow = true;
            leafMesh.receiveShadow = true;
            
            const dummy = new THREE.Object3D();
            
            for(let i = 0; i < leafCount; i++) {
                // Konik bir hacim içinde rastgele pozisyonlar
                const hRatio = Math.random(); // Yükseklik oranı (0-1)
                const yPos = hRatio * treeHeight; // Yerden yükseklik
                const currentRadius = (1 - hRatio) * maxRadius; // Yukarı çıktıkça daral
                
                const angle = Math.random() * Math.PI * 2;
                const radiusOffset = Math.random() * currentRadius; // Merkezden uzaklık

                dummy.position.set(
                    Math.cos(angle) * radiusOffset,
                    yPos + 2, // Biraz yukarı kaldır
                    Math.sin(angle) * radiusOffset
                );
                
                // Rastgele yönlere baktır
                dummy.lookAt(0, yPos + 2 + (Math.random()*5), 0); 
                dummy.rotateY(Math.random() * Math.PI);
                
                // Boyut varyasyonu
                const scale = 0.5 + Math.random() * 0.8;
                dummy.scale.set(scale, scale, scale);

                dummy.updateMatrix();
                leafMesh.setMatrixAt(i, dummy.matrix);
            }
            treeGroup.add(leafMesh);
        }

        //  SÜSLERİ OLUŞTURMA 
        function createOrnaments() {
            const treeHeight = 45;
            const maxRadius = 17; // Yapraklardan biraz daha içeride
            const ornamentCount = 250; // Görseldeki gibi yoğun
            
            // Süs Geometrisi ve Materyalleri
            const sphereGeo = new THREE.SphereGeometry(1, 16, 16);
            
            // Kırmızı Parlak Materyal
            const redMat = new THREE.MeshStandardMaterial({ 
                color: 0xdd0000, metalness: 0.7, roughness: 0.2 
            });
            // Beyaz/Gümüş Parlak Materyal
            const whiteMat = new THREE.MeshStandardMaterial({ 
                color: 0xeeeeee, metalness: 0.8, roughness: 0.1 
            });

            const redMesh = new THREE.InstancedMesh(sphereGeo, redMat, ornamentCount / 2);
            const whiteMesh = new THREE.InstancedMesh(sphereGeo, whiteMat, ornamentCount / 2);
            redMesh.castShadow = true; whiteMesh.castShadow = true;

            const dummy = new THREE.Object3D();

            for(let i = 0; i < ornamentCount; i++) {
                const hRatio = Math.random() * 0.9 + 0.05; // Çok tepeye ve dibe koyma
                const yPos = hRatio * treeHeight;
                const currentRadius = (1 - hRatio) * maxRadius;
                
                const angle = Math.random() * Math.PI * 2;
                // Süsler ağacın yüzeyine yakın olmalı
                const radiusOffset = currentRadius * (0.85 + Math.random() * 0.15);

                dummy.position.set(
                    Math.cos(angle) * radiusOffset,
                    yPos + 2,
                    Math.sin(angle) * radiusOffset
                );
                
                // Rastgele boyut
                const scale = 0.7 + Math.random() * 0.6;
                dummy.scale.set(scale, scale, scale);
                dummy.updateMatrix();

                // Yarısını kırmızı, yarısını beyaz yap
                if(i < ornamentCount / 2) {
                    redMesh.setMatrixAt(i, dummy.matrix);
                } else {
                    whiteMesh.setMatrixAt(i - ornamentCount/2, dummy.matrix);
                }
            }
            treeGroup.add(redMesh);
            treeGroup.add(whiteMesh);
        }

        //  YILDIZ 
        function createStar() {
            // Görseldeki gibi basit, 5 köşeli düz bir yıldız şekli çizelim
            const starShape = new THREE.Shape();
            const outerRadius = 4;
            const innerRadius = 2;
            const points = 5;
            
            for (let i = 0; i < points * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i / (points * 2)) * Math.PI * 2;
                // Yıldızın ucu yukarı baksın diye açıyı kaydırıyoruz (-Math.PI / 2)
                const x = Math.cos(angle - Math.PI / 2) * radius;
                const y = Math.sin(angle - Math.PI / 2) * radius;
                if (i === 0) starShape.moveTo(x, y);
                else starShape.lineTo(x, y);
            }
            starShape.closePath();

            const starGeo = new THREE.ShapeGeometry(starShape);
            
            // Parlayan Materyal 
            const starMat = new THREE.MeshStandardMaterial({ 
                color: 0xffd700, // Altın sarısı
                emissive: 0xffd700,
                emissiveIntensity: 0.8,
                metalness: 0.5,
                roughness: 0.2,
                side: THREE.DoubleSide // İki yüzü de görünsün
            });
            
            const star = new THREE.Mesh(starGeo, starMat);
            star.position.y = 48; // Ağacın tepesi
            treeGroup.add(star);
            
            // Yıldızdan yayılan ışık
            const starLight = new THREE.PointLight(0xffd700, 1, 50);
            starLight.position.set(0, 48, 2);
            treeGroup.add(starLight);
        }

        // KAR YAĞIŞI
        let snowSystem;
        function createSnow() {
            const snowGeo = new THREE.BufferGeometry();
            const snowCount = 2000;
            const positions = new Float32Array(snowCount * 3);
            const velocities = [];

            for(let i=0; i<snowCount; i++) {
                // Geniş bir alana yay
                positions[i*3] = (Math.random() - 0.5) * 200; // x
                positions[i*3+1] = Math.random() * 100;       // y
                positions[i*3+2] = (Math.random() - 0.5) * 200; // z
                
                // Her kar tanesi için farklı düşüş hızı
                velocities.push(0.1 + Math.random() * 0.2);
            }
            snowGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const snowMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.5,
                transparent: true,
                opacity: 0.8
            });
            
            snowSystem = new THREE.Points(snowGeo, snowMat);
            scene.add(snowSystem);
            snowSystem.userData = { velocities };
        }

        function updateSnow() {
            const positions = snowSystem.geometry.attributes.position.array;
            const velocities = snowSystem.userData.velocities;
            
            for(let i=0; i < positions.length / 3; i++) {
                // Y ekseninde aşağı indir
                positions[i*3 + 1] -= velocities[i];
                
                // Yere düşerse yukarı taşı
                if(positions[i*3 + 1] < 0) {
                    positions[i*3 + 1] = 100;
                }
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;
        }


        // BAŞLAT 
        createDenseTree();
        createOrnaments();
        createStar();
        createSnow();

        // Animasyon Döngüsü
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateSnow();
            renderer.render(scene, camera);
        }
        animate();

        // Pencere boyutu değişirse
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
